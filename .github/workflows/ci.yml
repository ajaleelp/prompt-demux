name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin deps
        working-directory: opencode-plugin
        run: npm install
      - name: Typecheck
        working-directory: opencode-plugin
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: opencode-plugin
        run: node --test tests/lib.test.ts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Classifier unit import check
        run: |
          pip install -r classifier-service/requirements.txt
          python -c "import ast; ast.parse(open('classifier-service/classifier.py').read())"
